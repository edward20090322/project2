<!doctype html><html lang="ru"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Горизонт</title>
<meta name="description" content="Горизонт: короткие уроки по дороге, деловому общению и навыкам будущего. Солнце цели дня, блиц, разминка и аккаунты с паролем.">
<meta name="theme-color" content="#0B7A85">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='9' fill='%230B7A85'/%3E%3Cpath d='M7 22a10 10 0 0 1 20 0z' fill='%23FFC247'/%3E%3Cpath d='M3 25h28' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;700;800&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Layout: sticky header with nav + stat pills; one centred column; a "horizon" card whose sun rises with today's XP. Phone: nav becomes a bottom bar. */
:root{
  --bg:#EDF2F6; --surface:#FFFFFF; --surface2:#E3EAF0; --ink:#0D1B2A; --muted:#4D5F72; --line:#D1DBE4;
  --accent:#0B7A85; --on-accent:#FFFFFF;
  --sun:#F59E0B; --on-sun:#2B1A00; --streak:#EA580C; --heart:#DB3A5B; --ice:#2B86CF;
  --good:#16784A; --good-bg:#DCF2E5; --good-d:#0D5A34; --on-good:#FFFFFF;
  --bad:#BE3A2C; --bad-bg:#FBE4E0; --bad-d:#8B2217; --on-bad:#FFFFFF;
  --u1:#0B7A85; --u2:#A8620A; --u3:#C2410C; --u4:#4F46E5; --on-u:#FFFFFF;
  --sky-a:#BDE1F1; --sky-b:#FFE3B4; --hill-a:#8FC3B6; --hill-b:#4C9A97; --sun-core:#FFB020; --sun-glow:#FFD77A;
  --f-d:'Geologica','Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-b:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08111B; --surface:#0F1B29; --surface2:#172A3C; --ink:#E8EEF4; --muted:#93A5B8; --line:#223548;
    --accent:#4FD1D0; --on-accent:#05181C;
    --sun:#FFC247; --on-sun:#2B1A00; --streak:#FF8A4C; --heart:#FF6B88; --ice:#6CB8F2;
    --good:#4BD58A; --good-bg:#12372A; --good-d:#7BE7AE; --on-good:#08241A;
    --bad:#FF7B6E; --bad-bg:#40201C; --bad-d:#FFA79E; --on-bad:#2A0A07;
    --u1:#4FD1D0; --u2:#F5B54A; --u3:#FF8A5B; --u4:#A3A9FF; --on-u:#07131C;
    --sky-a:#0A1830; --sky-b:#3A2F5C; --hill-a:#13394A; --hill-b:#0B2535; --sun-core:#FFC247; --sun-glow:#7A5A2A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08111B; --surface:#0F1B29; --surface2:#172A3C; --ink:#E8EEF4; --muted:#93A5B8; --line:#223548;
  --accent:#4FD1D0; --on-accent:#05181C;
  --sun:#FFC247; --on-sun:#2B1A00; --streak:#FF8A4C; --heart:#FF6B88; --ice:#6CB8F2;
  --good:#4BD58A; --good-bg:#12372A; --good-d:#7BE7AE; --on-good:#08241A;
  --bad:#FF7B6E; --bad-bg:#40201C; --bad-d:#FFA79E; --on-bad:#2A0A07;
  --u1:#4FD1D0; --u2:#F5B54A; --u3:#FF8A5B; --u4:#A3A9FF; --on-u:#07131C;
  --sky-a:#0A1830; --sky-b:#3A2F5C; --hill-a:#13394A; --hill-b:#0B2535; --sun-core:#FFC247; --sun-glow:#7A5A2A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ol,ul{margin:0}
h1,h2,h3{text-wrap:balance;font-family:var(--f-d)}
.ic{width:1.2em;height:1.2em;flex:none;display:block}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap-s{width:100%;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sub{font-size:14px;color:var(--muted)}
.mono{font-family:var(--f-m);font-weight:700}

/* header + nav */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font:800 18px var(--f-d);letter-spacing:-.01em;margin-right:auto}
.logo svg{width:32px;height:32px}
.nav{display:flex;gap:4px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:10px;padding:8px 12px;font:700 14px var(--f-b);color:var(--muted)}
.nav button .ic{width:20px;height:20px}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current=page]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.hdr-r{display:flex;align-items:center;gap:8px}
.stats{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:700 14px var(--f-m);font-variant-numeric:tabular-nums}
.pill .ic{width:17px;height:17px}
.pill.s .ic{color:var(--streak)} .pill.s.dim .ic{color:var(--muted)}
.pill.x .ic{color:var(--sun)} .pill.h .ic{color:var(--heart)}
.fz{display:inline-flex;align-items:center;gap:2px;margin-left:4px;padding-left:6px;border-left:1px solid var(--line);color:var(--ice);font-size:12px}
.fz .ic{width:13px;height:13px;color:var(--ice)}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--accent);color:var(--on-accent);font:800 15px var(--f-d);display:grid;place-items:center;padding:0}
.avatar:hover{border-color:var(--accent)}
main{padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:18px}
.vt{font:800 24px/1.2 var(--f-d);letter-spacing:-.02em}

/* cards, buttons, inputs */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{font:700 16px var(--f-d);margin-bottom:6px}
.btn{--b:var(--accent);--t:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;background:var(--b);color:var(--t);font:700 15px var(--f-b);transition:filter .15s,transform .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;filter:none;transform:none}
.btn.ghost{--b:transparent;--t:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.bad{--b:var(--bad);--t:var(--on-bad)}
.btn.sun{--b:var(--sun);--t:var(--on-sun)}
.btn.sm{padding:8px 14px;font-size:14px;min-height:40px}
.btn{min-height:44px}
.btn.wide{width:100%}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:500 16px var(--f-b)}
.inp:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
.inp.code{font:700 12px/1.4 var(--f-m);word-break:break-all;resize:vertical}
label.l{display:block;font:700 13px var(--f-b);color:var(--muted);margin:12px 0 6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px;color:var(--ink)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.err{min-height:20px;margin-top:10px;font-size:14px;font-weight:700;color:var(--bad)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:700 12px var(--f-b);background:var(--surface2);color:var(--muted)}
.badge.ok{background:var(--good-bg);color:var(--good-d)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 13px;font:700 14px var(--f-b);color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

/* horizon card: the sun rises with today's XP */
.horizon{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);min-height:190px;background:var(--sky-a)}
.hz-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hz-sun{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(var(--dy))}}
.hz-rays{transform-origin:468px 190px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hz-in{position:relative;z-index:1;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;max-width:58%;min-height:190px}
.hz-in small{font:700 12px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);opacity:.75}
.hz-in .big{font:800 34px/1 var(--f-d);letter-spacing:-.02em;color:var(--ink)}
.hz-in .big span{font:700 16px var(--f-d);opacity:.7}
.hz-in p{font-size:14px;color:var(--ink);opacity:.85}
.hz-in .btn{align-self:flex-start;margin-top:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-i{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:700 13px var(--f-b);color:var(--muted)}
.chip-i b{color:var(--ink);font-family:var(--f-m)}
.chip-i .ic{width:16px;height:16px}

/* courses + path */
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.course{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;min-width:0}
.course .row{display:flex;align-items:center;gap:8px}
.course .ci{width:30px;height:30px;border-radius:9px;background:var(--surface2);color:var(--muted);display:grid;place-items:center;flex:none}
.course .ci .ic{width:18px;height:18px}
.course b{font:700 14px/1.2 var(--f-b)}
.course small{font-size:12px;color:var(--muted)}
.course:hover{background:var(--surface2)}
.course.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.course.on .ci{background:var(--accent);color:var(--on-accent)}
.thin{height:5px;border-radius:9px;background:var(--surface2);overflow:hidden}
.thin i{display:block;height:100%;background:var(--bar,var(--accent));border-radius:9px}
.cdesc{color:var(--muted);font-size:14px}
.unit{--uc:var(--u1)}
.unit+.unit{margin-top:14px}
.uh{padding-bottom:12px;border-bottom:2px solid var(--uc)}
.uh .un{font:700 12px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--uc)}
.uh h2{font:700 20px/1.2 var(--f-d);letter-spacing:-.01em;margin:2px 0}
.uh p{color:var(--muted);font-size:14px}
.uh .thin{margin-top:10px;--bar:var(--uc)}

.uh{cursor:pointer;position:relative;padding-right:36px;background:none;border:0;border-bottom:2px solid var(--uc);width:100%;text-align:left;color:inherit;display:block}
.uh::after{content:"";position:absolute;right:8px;top:22px;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.unit.open .uh::after{transform:rotate(-135deg);top:28px}
.unit:not(.open) .lessons{display:none}
.unit:not(.open) .uh{padding-bottom:12px}
.tour-dots{display:flex;gap:6px;justify-content:center;margin:4px 0}
.tour-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--accent)}
.tour-ic{width:56px;height:56px;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);display:grid;place-items:center}
.tour-ic .ic{width:30px;height:30px}
.tour-row{display:flex;gap:10px}.tour-row .btn{flex:1}
.helpb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--accent);font:700 14px var(--f-b);padding:6px 0;margin:2px 0 10px}
.lessons{list-style:none;padding:0;margin:12px 0 0}
.lrow{position:relative;padding-left:46px}
.lrow::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:var(--line)}
.lrow:first-child::before{top:50%}
.lrow:last-child::before{bottom:50%}
.lrow:only-child::before{display:none}
.lrow.st-done::before{background:var(--uc)}
.dot{position:absolute;left:0;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted);z-index:1}
.dot .ic{width:16px;height:16px}
.st-done .dot{background:var(--uc);border-color:var(--uc);color:var(--on-u)}
.st-cur .dot{background:var(--sun);border-color:var(--sun);color:var(--on-sun);box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 28%,transparent)}
.lbtn{display:flex;align-items:center;gap:12px;width:100%;margin:5px 0;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:left}
.lbtn:hover{background:var(--surface2)}
.st-cur .lbtn{border-color:var(--uc);background:color-mix(in srgb,var(--uc) 8%,var(--surface))}
.st-locked .lbtn{opacity:.62}
.lt{flex:1;min-width:0}
.lt b{display:block;font:700 16px/1.3 var(--f-b)}
.lt small{font-size:13px;color:var(--muted)}
.lgo{font:700 13px var(--f-b);color:var(--uc);white-space:nowrap}
.st-locked .lgo{color:var(--muted)}
.endcard{text-align:center;margin-top:14px}

/* practice hub */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pc .pi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface2));color:var(--c,var(--accent))}
.pc .pi .ic{width:24px;height:24px}
.pc h3{font:700 17px var(--f-d)}
.pc p{font-size:14px;color:var(--muted);flex:1}
.pc .btn{align-self:flex-start}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font:700 14px var(--f-b);padding:4px 0}
.back .ic{width:18px;height:18px}
.tl{display:flex;flex-direction:column}
.trow{padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow b{display:block;font:700 16px var(--f-b)}
.trow span{font-size:14px;color:var(--muted)}
.trow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:700 13px var(--f-b);color:var(--muted)}
.fchips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* profile */
.hero{display:flex;gap:16px;align-items:center}
.lvl{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 26px var(--f-d);flex:none}
.hero h2{font:700 20px var(--f-d);margin:0 0 2px}
.hero .thin{height:8px;margin-top:10px;--bar:var(--sun)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile small{display:flex;align-items:center;gap:6px;font:700 11px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile small .ic{width:15px;height:15px}
.tile b{display:block;font:700 24px/1.2 var(--f-m);margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:140px;margin-top:10px}
.wcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.wbar{width:100%;max-width:32px;border-radius:8px 8px 3px 3px;background:var(--surface2);min-height:6px}
.wcol.has .wbar{background:var(--sun)}
.wv{font:700 11px var(--f-m);color:var(--muted);min-height:14px}
.wd{font:700 12px var(--f-b);color:var(--muted)}
.wcol.now .wd{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.ach{display:flex;gap:12px;align-items:center;padding:11px;border:1.5px solid var(--line);border-radius:14px;opacity:.6}
.ach.on{opacity:1;border-color:var(--accent)}
.ach .ai{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.ach.on .ai{background:var(--accent);color:var(--on-accent)}
.ach b{display:block;font-size:14px;line-height:1.3}
.ach span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.setrow.first{border-top:0}
.setrow>span{min-width:0;flex:1 1 200px}
.setrow small{display:block;color:var(--muted);font-size:13px}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:28px 36px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .rk{font:700 15px var(--f-m);color:var(--muted);text-align:center}
.prow.me{font-weight:700}
.prow b{display:block;overflow-wrap:anywhere}
.prow small{color:var(--muted);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 15px var(--f-d);flex:none}

/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-top-in{display:flex;align-items:center;gap:12px;padding-block:12px}
.xbtn{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;padding:0}
.xbtn:hover{background:var(--surface2)}
.xbtn .ic{width:22px;height:22px}
.hzbar{--w:0%;flex:1;height:24px;position:relative}
.hzbar::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;border-radius:3px;background:var(--surface2);transform:translateY(-50%)}
.hzbar i{position:absolute;left:0;top:50%;height:4px;border-radius:3px;width:var(--w);background:var(--accent);transform:translateY(-50%);transition:width .35s ease}
.hzbar b{position:absolute;top:50%;left:var(--w);width:20px;height:20px;border-radius:50%;background:var(--sun);transform:translate(-50%,-50%);transition:left .35s ease;box-shadow:0 0 0 5px color-mix(in srgb,var(--sun) 26%,transparent)}
.l-hearts{display:flex;align-items:center;gap:6px;font:700 16px var(--f-m);color:var(--heart);flex:none;min-width:52px;justify-content:flex-end}
.l-hearts .ic{width:22px;height:22px}
.l-hearts.timer{color:var(--ink)}
.l-main{flex:1;overflow:auto;padding-block:14px 28px}
.qwrap{animation:in .22s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qkind{font:700 12px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.q{font:700 23px/1.3 var(--f-d);letter-spacing:-.01em;margin-bottom:20px}
.q:focus{outline:none}
.sign{width:112px;height:112px;margin:0 auto 16px}
.sign.wide{width:min(260px,80%);height:auto}
.sign svg{width:100%;height:100%;display:block}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font:500 16px/1.35 var(--f-b);color:var(--ink)}
.opt:hover{background:var(--surface2)}
.opt .k{display:grid;place-items:center;flex:none;width:28px;height:28px;border:1.5px solid var(--line);border-radius:8px;font:700 13px var(--f-m);color:var(--muted)}
.opt.big{justify-content:center;text-align:center;padding-block:24px;font:700 18px var(--f-b)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good-d)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-d)}
.done .opt{cursor:default}
.slots{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:12px;border:2px dashed var(--line);border-radius:16px;margin-bottom:16px}
.slots .hint{color:var(--muted);font-size:14px;align-self:center;margin:auto;text-align:center}
.pool{display:flex;flex-direction:column;gap:8px}
.chip{width:100%;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font:500 15px/1.35 var(--f-b);color:var(--ink)}
.chip:hover{background:var(--surface2)}
.chip.used{visibility:hidden}
.slots .chip{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.slots .chip.right{border-color:var(--good);background:var(--good-bg);color:var(--good-d)}
.slots .chip.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-d)}
.mhint{color:var(--muted);font-size:14px;margin:-8px 0 14px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mi{display:flex;gap:8px;align-items:center;width:100%;min-height:64px;text-align:left;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font:500 13px/1.35 var(--f-b);color:var(--ink);hyphens:auto}
@media (min-width:480px){.mi{font-size:14px;gap:10px;padding:10px 12px}}
.mi:hover{background:var(--surface2)}
.mi:disabled{cursor:default}
.mi.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.mi.right{border-color:var(--good);background:var(--good-bg);color:var(--good-d)}
.mi.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-d)}
.mi>span:last-child{min-width:0;overflow-wrap:break-word}
.mb{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:8px;font:700 13px var(--f-m);color:#fff;background:var(--accent)}
.mb.p0{background:#2F5FD0}.mb.p1{background:#0B7A85}.mb.p2{background:#A8620A}.mb.p3{background:#B0306A}.mb.p4{background:#5D6B7A}
.mb.empty{background:transparent;border:2px dashed var(--line)}
.correct{margin-top:16px;padding:14px 16px 14px 36px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.correct b{display:block;margin-left:-20px;margin-bottom:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.correct li{margin:3px 0}
.l-foot{border-top:1px solid var(--line);background:var(--bg);padding-block:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.l-foot .wrap-s{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.l-foot.good{background:var(--good-bg);border-color:transparent}
.l-foot.bad{background:var(--bad-bg);border-color:transparent}
.fb{flex:1 1 260px;min-width:0}
.fb:empty{display:none}
.fb b{display:flex;gap:8px;align-items:center;font:700 18px var(--f-d)}
.fb b .ic{width:22px;height:22px}
.fb p{margin-top:4px;font-size:14px;line-height:1.45}
.l-foot.good .fb{color:var(--good-d)}
.l-foot.bad .fb{color:var(--bad-d)}
.l-foot.good .btn{--b:var(--good);--t:var(--on-good)}
.l-foot.bad .btn{--b:var(--bad);--t:var(--on-bad)}
#lbtn{margin-left:auto;min-width:190px}
.lesson.blitz .l-foot{display:none}
.res{text-align:center;padding-top:4vh;animation:in .3s ease both}
.burst{width:88px;height:88px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--sun);color:var(--on-sun);box-shadow:0 0 0 10px color-mix(in srgb,var(--sun) 25%,transparent)}
.burst .ic{width:44px;height:44px}
.burst.fail{background:var(--heart);color:#fff;box-shadow:0 0 0 10px color-mix(in srgb,var(--heart) 25%,transparent)}
.res h2{font:800 26px/1.2 var(--f-d);letter-spacing:-.02em;margin-bottom:6px}
.res .sub{margin-bottom:22px}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.t3 div{border:1.5px solid var(--c);border-radius:14px;overflow:hidden;background:var(--surface)}
.t3 small{display:block;background:var(--c);color:var(--cc,#fff);font:700 11px var(--f-b);letter-spacing:.08em;text-transform:uppercase;padding:5px 4px}
.t3 b{display:block;font:700 24px/1 var(--f-m);padding:14px 4px}
.note{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-top:10px;font-weight:500;font-size:14px}

/* sheet, toast, auth */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(5,10,20,.58);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .2s ease both}
.sheet-card .sk{font:700 12px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet-card h3{font:700 22px/1.2 var(--f-d);letter-spacing:-.01em}
.sheet-card .sd{color:var(--muted);margin-bottom:4px}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gopts button{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.gopts button b{font:700 20px var(--f-m)}
.gopts button small{color:var(--muted)}
.gopts button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:600px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100vw - 32px);text-align:center}
.auth{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(180deg,var(--sky-a),var(--sky-b));padding-top:env(safe-area-inset-top,0px)}
.auth-in{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.auth-card .brand{display:flex;align-items:center;gap:9px;font:800 18px var(--f-d);margin-bottom:14px}
.auth-card .brand svg{width:32px;height:32px}
.auth-card h1{font:800 24px/1.2 var(--f-d);letter-spacing:-.02em;margin-bottom:4px}
.auth-card .btn{margin-top:10px}
.alist{display:flex;flex-direction:column;gap:8px;margin:14px 0 6px;max-height:40vh;overflow:auto}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.arow:hover{background:var(--surface2)}
.arow b{display:block}
.arow small{color:var(--muted);font-size:12px}
.linkb{border:0;background:transparent;color:var(--accent);font:700 14px var(--f-b);padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:confetti-fall 1.4s ease-in forwards}
@keyframes confetti-fall{to{transform:translateY(100vh) rotate(540deg);opacity:0}}

/* responsive */
@media (max-width:759px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;justify-content:space-around;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .nav button{flex:1;flex-direction:column;gap:2px;justify-content:center;padding:8px 6px;font-size:12px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

  .logo{font-size:16px}.logo span{display:none}
  .stats{gap:4px}

  .q{font-size:21px}
  .opts.two{grid-template-columns:1fr}
  .opt.big{padding-block:16px}
  #lbtn{width:100%;margin-left:0}
  .t3 b{font-size:21px}

/* map path: zigzag nodes, banner headers, pixel mascots */
.unit .uh{background:var(--uc);color:var(--on-u);border:0;border-radius:16px;padding:14px 40px 14px 16px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.unit .uh *{color:inherit}.unit .uh .thin{background:rgba(255,255,255,.3)}.unit .uh .thin i{background:#fff}
.unit{overflow-x:clip}
.unit .lessons{display:flex;flex-direction:column;gap:12px;margin:22px 0 8px;padding:0;list-style:none}
.tn{display:flex;flex-direction:column;align-items:center;position:relative}
.tn>.nd,.tn>.nl,.tn>.go{transform:translateX(var(--o,0px))}
.tn>.nd:active{transform:translateX(var(--o,0px)) translateY(4px)}
.smiler{animation:bob 2.6s ease-in-out infinite}
/* look: glow, 3D buttons, glossy nodes */
body{background:radial-gradient(900px 420px at 50% -140px,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--bg)}
.card{box-shadow:0 10px 28px -18px rgba(13,27,42,.45)}
.btn:not(.ghost):not(:disabled){box-shadow:0 4px 0 color-mix(in srgb,var(--b) 60%,#000)}
.btn:not(.ghost):not(:disabled):active{box-shadow:0 1px 0 color-mix(in srgb,var(--b) 60%,#000)}
.unit .uh{background:linear-gradient(135deg,var(--uc),color-mix(in srgb,var(--uc) 62%,#000))}
.nd{position:relative}.nd::after{content:"";position:absolute;inset:6px 16px auto;height:32%;border-radius:50%;background:rgba(255,255,255,.26);pointer-events:none}
.st-locked .nd::after{opacity:.35}
.horizon{box-shadow:0 14px 34px -20px color-mix(in srgb,var(--accent) 70%,#000)}
.hdr{box-shadow:0 6px 20px -16px rgba(13,27,42,.6)}
.avatar{overflow:hidden}.avatar svg{width:100%;height:100%;display:block}
.swt{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);padding:0}
.swt[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.chip-i[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.boss .nd{width:88px;height:82px;background:#fff3b0;box-shadow:0 6px 0 #d4a900}
.boss.st-locked .nd{background:var(--surface2);box-shadow:0 6px 0 var(--line)}
.sp-b{filter:drop-shadow(0 0 7px #c9a8ff)}
.nd{width:74px;height:68px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.nd:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}.nd .ic{width:30px;height:30px}
.st-done .nd{background:var(--sun);color:var(--on-sun)}
.st-cur .nd{background:var(--uc);color:var(--on-u);box-shadow:0 0 0 6px color-mix(in srgb,var(--uc) 28%,transparent),0 6px 0 rgba(0,0,0,.3)}
.st-locked .nd{background:var(--surface2);color:var(--muted);box-shadow:0 6px 0 var(--line)}
.st-open .nd{background:var(--uc);color:var(--on-u);opacity:.7}
.bonus .nd{background:linear-gradient(#b277ff,#7a3fe0);color:#fff}
.bonus.st-done .nd{background:var(--sun);color:var(--on-sun)}
.nl{font:700 12px/1.25 var(--f-b);color:var(--muted);max-width:140px;text-align:center;margin-top:8px}
.go{font:800 12px var(--f-d);text-transform:uppercase;color:var(--uc);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:3px 10px;margin-bottom:8px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.mas{position:absolute;top:0;pointer-events:none}.mas.L{left:2%}.mas.R{right:2%}
.st-locked .mas{opacity:.5;filter:grayscale(.5)}
@media (prefers-reduced-motion:reduce){.go{animation:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hz-sun{transform:translateY(var(--dy))}
}

/* design polish: depth + motion */
.card,.pc,.tile,.ach,.admunit,.admq{box-shadow:0 1px 2px rgba(13,27,42,.04),0 1px 0 rgba(13,27,42,.02)}
.card{transition:box-shadow .18s ease,transform .18s ease}
.course,.lbtn,.pc,.tile{transition:box-shadow .18s ease,transform .12s ease,border-color .18s ease}
.course:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,27,42,.08)}
.pc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,27,42,.08)}
.lbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(13,27,42,.07)}
.tile:hover{transform:translateY(-1px)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .pc,:root:not([data-theme="light"]) .tile,:root:not([data-theme="light"]) .ach,:root:not([data-theme="light"]) .admunit,:root:not([data-theme="light"]) .admq{box-shadow:0 1px 2px rgba(0,0,0,.25)}
  :root:not([data-theme="light"]) .course:hover,:root:not([data-theme="light"]) .pc:hover,:root:not([data-theme="light"]) .lbtn:hover{box-shadow:0 6px 18px rgba(0,0,0,.35)}
}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .pc,:root[data-theme="dark"] .tile,:root[data-theme="dark"] .ach,:root[data-theme="dark"] .admunit,:root[data-theme="dark"] .admq{box-shadow:0 1px 2px rgba(0,0,0,.25)}
:root[data-theme="dark"] .course:hover,:root[data-theme="dark"] .pc:hover,:root[data-theme="dark"] .lbtn:hover{box-shadow:0 6px 18px rgba(0,0,0,.35)}

/* admin (CMS) */
.admtable{display:flex;flex-direction:column}
.admrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.admrow:first-child{border-top:0}
.admname{flex:1 1 180px;min-width:0}
.admname b{font-size:15px}
.admname .badge{margin-left:6px;vertical-align:middle}
.admname small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.admactions{display:flex;gap:6px;flex-wrap:wrap}
.admunit{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}

.admnote{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid var(--line);font-size:14px;margin-top:10px}
select.inp{appearance:auto}
.zone{font:700 12px var(--f-b);letter-spacing:.08em;text-transform:uppercase;padding:10px 0 4px}
.zone.up{color:var(--good)}.zone.down{color:var(--bad)}.zone.mid{color:var(--muted)}

.tag.me{background:var(--accent);color:var(--on-accent)}
.league{display:flex;gap:14px;align-items:center;margin-top:6px}

.lg-badge.l0{background:#B0702F}.lg-badge.l1{background:#7A8797}.lg-badge.l2{background:#C99700}.lg-badge.l3{background:#2C928C}.lg-badge.l4{background:#4F6FE8}
.rvbtn{padding:6px 10px;font-size:12px;min-height:30px;gap:5px}

.opt.right,.mi.right,.slots .chip.right{animation:pop .34s ease}

  C('«Либо ты со мной, либо против меня». Какая это ошибка?',['Апелляция к авторитету','Ложная дилемма','Скользкая дорожка','Подмена тезиса'],1,'Ложная дилемма оставляет два варианта там, где их больше.'),
  T('Если два явления растут одновременно, одно всегда вызывает другое.',false,'Продажи мороженого и случаи утопления растут летом, но причина общая: жара.'),
  O('Расставь вопросы, которые стоит задать утверждению.',['Что именно утверждается?','Какие есть доказательства?','Кто и зачем это говорит?','Что говорят независимые источники?'],'Сначала формулировка, потом доказательства, потом интересы автора и сверка с другими источниками.'),C("Как называется приём, когда спорят с упрощённой версией чужой мысли?",["Соломенное чучело", "Апелляция к опыту", "Золотая середина", "Мозговой штурм"],0,"Искажённую версию легко «победить», но настоящий аргумент при этом остаётся без ответа.")]},
 {id:'th3',title:'Решения без гарантий',q:[
  C('Шанс дождя был 30%. Ты взял зонт, дождя не было. Решение было плохим?',['Да, итог показал ошибку','Нет, решение оценивают по информации на момент выбора','Да, надо было ставить на 50%','Оценить нельзя'],1,'Хорошее решение и хороший результат не одно и то же. Нужно оценивать, что было известно тогда.'),
  T('Хорошее решение всегда приводит к хорошему результату.',false,'В игре с вероятностями результат бывает неудачным и при верном решении.'),
  C('Что помогает не цепляться за невозвратные затраты?',['Вложить ещё, чтобы отбить прошлое','Спросить, сколько уже потрачено','Спросить: начал бы я это сегодня с нуля?','Игнорировать любые данные'],2,'Уже потраченное не вернуть. В расчёт идут только будущие затраты и выгоды.'),
  O('Расставь шаги принятия решения.',['Сформулируй цель','Перечисли варианты','Оцени риски и выгоды','Выбери и назначь срок пересмотра'],'Срок пересмотра защищает от двух крайностей: бесконечных сомнений и упрямства.'),T("Хорошее решение всегда приводит к хорошему результату.",false,"На результат влияет и удача. Решение оценивают по тому, что было известно в момент выбора.")]}]},
{course:'future',title:'Деньги и будущее',desc:'Сложный процент, бюджет и риск',c:3,lessons:[
 {id:'mo1',title:'Сложный процент',q:[
  C('Вкладываешь 100 единиц под 10% годовых со сложным процентом. Сколько будет через 2 года?',['110','120','121','130'],2,'100 × 1,1 × 1,1 = 121. Во второй год процент начисляется и на прибыль первого.'),
  T('Чем раньше начинаешь копить, тем сильнее работает сложный процент.',true,'Время даёт больше периодов начисления, поэтому ранние взносы вырастают сильнее.'),
  C('По правилу 72 за сколько примерно лет деньги удвоятся при 8% годовых?',['4 года','9 лет','12 лет','18 лет'],1,'72 ÷ 8 = 9. Правило даёт быструю оценку без калькулятора.'),
  O('Расставь шаги, чтобы процент работал на тебя.',['Определи цель','Настрой регулярный взнос','Не снимай деньги без нужды','Пересматривай план раз в год'],'Регулярность и терпение важнее размера первого взноса.'),C("Что даёт сложный процент?",["Проценты начисляются и на ранее начисленные проценты", "Фиксированную сумму каждый год", "Гарантию от убытков", "Налоговый вычет"],0,"Поэтому рост ускоряется со временем. Чем раньше начать, тем сильнее эффект."),C("Анимация показывает рост вклада. Почему каждый столбец прибавляет больше предыдущего?",["Проценты начисляются и на уже накопленные проценты", "Банк каждый год повышает ставку", "Вкладчик каждый раз вносит больше", "Растёт инфляция"],0,"Это сложный процент: база для начисления растёт, поэтому прирост ускоряется.",'anim_growth')]},
 {id:'mo2',title:'Бюджет и подушка',q:[
  C('Что такое финансовая подушка?',['Деньги на отпуск','Запас на 3–6 месяцев обязательных расходов','Вклад в акции','Кредитный лимит'],1,'Подушка нужна на случай потери дохода или срочных трат. Чаще всего советуют 3–6 месяцев расходов.'),
  C('Правило 50/30/20 делит доход на...',['Нужное, желаемое, сбережения','Налоги, долги, отпуск','Еда, жильё, транспорт','Банк, брокер, касса'],0,'Примерно 50% на необходимое, 30% на желания и 20% на накопления. Пропорции можно менять под себя.'),
  T('Льготный период кредитной карты делает деньги бесплатными, даже если вернуть долг позже срока.',false,'Если не успеть вернуть вовремя, проценты обычно начисляются на всю сумму.'),
  O('Расставь шаги ведения бюджета.',['Запиши доходы','Раздели расходы на обязательные и необязательные','Задай лимиты','Раз в неделю сверяй план с фактом'],'Бюджет работает, когда его сверяют с реальностью, а не пишут один раз.'),T("Деньги финансовой подушки должны быть доступны быстро.",true,"Подушка нужна на непредвиденный случай, поэтому её не вкладывают в то, что нельзя быстро вернуть.")]},
 {id:'mo3',title:'Риск и разнообразие',q:[
  C('Что значит диверсификация?',['Не держать все деньги в одном активе','Купить самый дорогой актив','Продавать при любом падении','Брать кредит для вложений'],0,'Если один актив упал, другие смягчают потери.'),
  T('Обещание высокой доходности без риска должно насторожить.',true,'Доходность и риск связаны. Обещания «гарантированно и много» часто признак мошенничества.'),
  C('Чем выше потенциальная доходность, тем обычно...',['Ниже риск','Короче срок','Выше риск','Меньше налогов'],2,'Рынок платит за готовность принять неопределённость.'),
  O('Расставь вопросы перед вложением.',['На какой срок и ради какой цели?','Какой убыток я могу выдержать?','Какие условия и комиссии?','Какую небольшую сумму вложить для начала?'],'Сначала цель и допустимый убыток, потом условия, и только потом сумма.'),T("Вложить все деньги в один актив — лучший способ снизить риск.",false,"Разнообразие снижает риск: проблемы одного актива не обрушивают весь капитал.")]}]},
{course:'future',title:'Учись учиться',desc:'Внимание, запоминание и привычки',c:4,lessons:[
 {id:'le1',title:'Внимание и фокус',q:[
  C('Что сильнее всего снижает глубокую концентрацию?',['Тишина','Частые переключения и уведомления','Чёткая цель','Короткие перерывы'],1,'После каждого переключения мозгу нужно время, чтобы вернуться в задачу.'),
  T('Многозадачность делает работу эффективнее.',false,'На деле мы быстро переключаемся между задачами и теряем время и качество.'),
  C('Что такое техника «Помодоро»?',['Работа 8 часов подряд','Работа блоками, обычно по 25 минут, с короткими перерывами','Сон по 20 минут','Список из 100 дел'],1,'Короткие блоки с отдыхом помогают держать внимание и не выгорать.'),
  O('Расставь шаги короткого рабочего блока.',['Выбери одну задачу','Убери отвлекающее','Поставь таймер','Отдохни 5 минут'],'Одна задача и убранные помехи важнее самого таймера.'),T("Многозадачность обычно снижает качество внимания и скорость работы.",true,"Переключения стоят времени и сил. Лучше делать одно дело, потом другое.")]},
 {id:'le2',title:'Как запоминать надолго',q:[
  C('Что лучше работает для запоминания?',['Перечитывать конспект много раз','Подчёркивать цветным маркером','Вспоминать материал без подсказок','Слушать лекцию фоном'],2,'Усилие вспомнить закрепляет память лучше, чем пассивное перечитывание.'),
  C('Интервальное повторение это...',['Всё повторить в ночь перед экзаменом','Повторение с растущими паузами','Повторение каждую минуту','Учить только новое'],1,'Паузы растут: день, неделя, месяц. Так материал переходит в долгую память.'),
  T('Объяснить тему своими словами хороший способ проверить понимание.',true,'Если не получается объяснить просто, значит, есть пробел. Этот приём связывают с Ричардом Фейнманом.'),
  O('Расставь повторения по времени.',['Выучи тему','Повтори через день','Повтори через неделю','Повтори через месяц'],'Каждое следующее повторение можно отложить дальше, пока ты помнишь материал.'),C("Какой способ лучше для долгой памяти?",["Повторять через растущие интервалы", "Перечитать всё один раз ночью перед экзаменом", "Подчёркивать весь текст", "Слушать фоном"],0,"Интервальные повторения и проверка себя запоминаются надолго лучше простого перечитывания.")]},
 {id:'le3',title:'Привычки',q:[
  C('Какую привычку проще удержать?',['Огромную, начиная с понедельника','Маленькую, привязанную к уже привычному действию','Без конкретного времени','Зависящую от настроения'],1,'Малый шаг и понятный триггер снижают порог входа. Например: «после чая читаю одну страницу».'),
  T('Пропустил один день, значит, привычка потеряна навсегда.',false,'Один пропуск ничего не ломает. Важно не пропускать два раза подряд.'),
  C('Зачем делать 2 минуты, когда нет сил на полную тренировку?',['Чтобы побить рекорд','Чтобы не думать о цели','Чтобы быстрее похудеть','Чтобы сохранить ритм и снизить порог входа'],3,'Ритм ценнее объёма. Маленькое действие сохраняет привычку живой.'),
  O('Расставь шаги формирования привычки.',['Выбери крошечное действие','Привяжи его к триггеру','Отмечай каждое выполнение','Постепенно увеличивай нагрузку'],'Увеличивать нагрузку стоит только после того, как действие стало автоматическим.'),T("Маленькое действие каждый день закрепляет привычку лучше, чем редкий большой рывок.",true,"Регулярность важнее размера. Привычка растёт из повторения.")]}]}
];

(function(){
function clockPts(){
  var cx=100,cy=100,r=82,out='',col={9:'#1E9E57',3:'#1E9E57',10:'#F08A1C',2:'#F08A1C',8:'#F08A1C',4:'#F08A1C'};
  for(var h=1;h<=12;h++){

    out+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="11" fill="'+c+'" stroke="#fff" stroke-width="2"/><text x="'+x.toFixed(1)+'" y="'+(y+4.5).toFixed(1)+'" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="13" fill="#fff">'+h+'</text>';
  }
  return out;
}

function clean(o){
  const b=blank();let v;
  if(!o||typeof o!=='object'||Array.isArray(o))return b;
  [['xp',1e9],['hAt',9e15],['streak',1e5],['best',1e5],['right',1e7],['total',1e7],['perfect',1e5],['freezes',2],['sinceFz',3],['blitz',999],['chests',99],['chestAt',1e5],['upd',9e15]].forEach(p=>{v=num(o[p[0]],0,p[1]);if(v!==null)b[p[0]]=v});

  if(o.hist&&typeof o.hist==='object')for(const k in o.hist){v=+o.hist[k];if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&isFinite(v)&&v>0)b.hist[k]=Math.floor(v)}
  if(o.weak&&typeof o.weak==='object')for(const k in o.weak){const w=o.weak[k];if(w&&FLAT.some(f=>f.id===w.lid&&f.l.q[w.qi]))b.weak[k]={lid:w.lid,qi:+w.qi}}
  if(o.day&&typeof o.day==='object'){
    if(typeof o.day.d==='string')b.day.d=o.day.d.slice(0,10);

function admValidate(){
  AB.unitTitle=(AB.unitTitle||'').trim();AB.unitDesc=(AB.unitDesc||'').trim();AB.lessonTitle=(AB.lessonTitle||'').trim();
  if(AB.unitTitle.length<2)return 'Укажи название раздела.';
  if(AB.lessonTitle.length<2)return 'Укажи название урока.';
  if(!AB.qs.length)return 'Добавь хотя бы один вопрос.';
  for(let i=0;i<AB.qs.length;i++){
    const q=AB.qs[i],n='Вопрос '+(i+1)+': ';q.q=(q.q||'').trim();q.e=(q.e||'').trim();
    if(q.q.length<2)return n+'заполни текст вопроса.';
    if(q.e.length<2)return n+'заполни объяснение.';
    if(q.t==='c'){
      q.o=q.o.map(o=>(o||'').trim());
      if(q.o.some(o=>o.length<1))return n+'заполни все варианты ответа.';
      if(new Set(q.o.map(o=>o.toLowerCase())).size<q.o.length)return n+'варианты не должны повторяться.';
    }
    if(q.t==='o'){
      q.items=q.items.map(o=>(o||'').trim());
      if(q.items.some(o=>!o))return n+'заполни все шаги.';
      if(new Set(q.items.map(o=>o.toLowerCase())).size<q.items.length)return n+'шаги не должны повторяться.';
    }
    if(q.t==='m'){
      q.pairs=q.pairs.map(p=>[(p[0]||'').trim(),(p[1]||'').trim()]);
      if(q.pairs.some(p=>!p[0]||!p[1]))return n+'заполни обе стороны каждой пары.';
      if(new Set(q.pairs.map(p=>p[1].toLowerCase())).size<q.pairs.length)return n+'описания пар не должны повторяться.';
    }
  }
  return '';
}
function qFromAB(q){

}

function faceStart(){
  const svg=document.querySelector('.face-anim');if(!svg||svg._on)return;svg._on=1;
  const g=k=>svg.querySelector('[data-f="'+k+'"]');
  const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
  const E=FE.map(e=>({n:e[0],v:e[1].concat(e[2],[e[3],e[4],e[6],e[7]]),c:hx(e[5])}));
  const HOLD=1400,TR=700,CY=HOLD+TR,t0=performance.now();
  function tick(now){
    if(!document.body.contains(svg))return;
    const d=Math.max(0,now-t0),k=Math.floor(d/CY),ph=d%CY;
    const a=E[k%E.length],b=E[(k+1)%E.length];
    let u=ph<HOLD?0:(ph-HOLD)/TR;u=u*u*(3-2*u);
    const v=a.v.map((x,j)=>x+(b.v[j]-x)*u);
    const c='rgb('+a.c.map((x,j)=>Math.round(x+(b.c[j]-x)*u)).join(',')+')';
    g('m').setAttribute('d','M'+v[0]+' '+v[2]+'Q60 '+v[3]+' '+v[1]+' '+v[2]+'Q60 '+v[4]+' '+v[0]+' '+v[2]+'Z');
    g('bl').setAttribute('d','M'+v[5]+' '+v[6]+'L'+v[7]+' '+v[8]);
    g('br').setAttribute('d','M'+(120-v[5])+' '+v[6]+'L'+(120-v[7])+' '+v[8]);
    g('el').setAttribute('r',v[9]);g('er').setAttribute('r',v[9]);
    g('pl').setAttribute('r',v[10]);g('pr').setAttribute('r',v[10]);
    g('f').setAttribute('fill',c);
    g('t').setAttribute('opacity',v[11]);g('sw').setAttribute('opacity',v[12]);
    g('lb').textContent=u<.5?a.n:b.n;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

const corrText=q=>q.t==='c'?q.o[q.a]:(q.t==='tf'?(q.a?'Верно':'Неверно'):'');
function check(){
  const c=L.cur,q=c.q;let ok;
  if(q.t==='c')ok=c.ord[c.sel]===q.a;
  else if(q.t==='tf')ok=(c.sel===1)===q.a;
  else if(q.t==='m')ok=q.pairs.every((_,i)=>c.mp[i]===i);
  else ok=c.placed.every((v,i)=>v===i);
  L.state=ok?'good':'bad';
  const body=$('#lbody');body.classList.add('done');
  if(q.t==='c'||q.t==='tf'){
    body.querySelectorAll('.opt').forEach(x=>{
      const k=+x.dataset.k;x.classList.remove('sel');
      const isRight=q.t==='c'?c.ord[k]===q.a:(k===1)===q.a;
      if(isRight)x.classList.add('right');else if(k===c.sel)x.classList.add('wrong');
    });
  }else if(q.t==='m'){
    drawMatch();
    if(!ok)$('#corr').innerHTML='<ol class="correct"><b>Правильные пары</b>'+q.pairs.map(p=>'<li>'+p[0]+' — '+p[1]+'</li>').join('')+'</ol>';
  }else{
    body.querySelectorAll('#slots .chip').forEach((x,p)=>{x.classList.add(+x.dataset.i===p?'right':'wrong');x.disabled=true});
    body.querySelectorAll('#pool .chip').forEach(x=>{x.disabled=true});
    if(!ok)$('#corr').innerHTML='<ol class="correct"><b>Правильный порядок</b>'+q.items.map(t=>'<li>'+t+'</li>').join('')+'</ol>';
  }
  record(c,ok);
  if(ok){L.right++}
  else{
    L.mistakes++;
    if(!L.practice)loseHeart();
    if(!c.retry)L.queue.push({q,lid:c.lid,qi:c.qi,retry:true});
    if(!L.practice&&S.hearts<=0)L.fail=true;
  }
  sfx(ok?'ok':'bad');
  save();renderHdr();lessonHearts();setFoot();updBar();
  const cr=$('#corr');
  if(!ok&&cr&&cr.firstChild&&cr.scrollIntoView)cr.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function fvLevel(n){
  const k=(n-1)%6,tier=Math.floor((n-1)/6);
  const err=Math.min(4,2+Math.floor(tier/2));
  const lv={n:n,kind:'mix',course:'',err:err,cards:Math.min(10,5+tier),sec:0,name:'Классика',desc:'Вопросы и утверждения вперемешку. Найди карточки с ошибкой.'};
  if(k===1){const c=FV_COURSES[tier%3];lv.course=c[0];lv.name='Тема: '+c[1];lv.desc='Все карточки из одной темы.'}
  if(k===2){lv.kind='tf';lv.name='Верно или неверно';lv.desc='Только утверждения. Найди неверные.'}
  if(k===3){lv.kind='c';lv.name='Вопрос и ответ';lv.desc='В некоторых парах «вопрос — ответ» ответ неверный.'}
  if(k===4){lv.sec=Math.max(30,45-tier*3);lv.name='На время';lv.desc='Раунд на '+lv.sec+' секунд. Когда время выйдет, проверка пройдёт сама.'}
  if(k===5){lv.cards=Math.min(11,lv.cards+2);lv.name='Длинный список';lv.desc='Карточек больше, чем обычно. Ошибок столько же.'}

function fvLvPool(lv){
  let p=L.all;
  if(lv.kind==='tf')p=p.filter(x=>x.q.t==='tf');
  else if(lv.kind==='c')p=p.filter(x=>x.q.t==='c');
  else if(lv.course)p=p.filter(x=>x.course===lv.course);
  return p.length>=24?p:L.all;
}
function fvRound(lv){
  const N=lv.cards,E=lv.err,pool=fvLvPool(lv);
  let deck=shuffle(pool.filter(x=>L.last.indexOf(x)<0));
  if(deck.length<N*2)deck=shuffle(pool);
  const cand=deck.concat(shuffle(pool)),err=[],cor=[],used=[];
  for(let i=0;i<cand.length&&err.length+cor.length<N;i++){
    const x=cand[i],q=x.q;
    if(used.indexOf(x)>-1)continue;
    let wantErr;
    if(q.t==='tf'){
      wantErr=!q.a;
      if(wantErr?err.length>=E:cor.length>=N-E)continue;
    }else{
      if(err.length>=E)wantErr=false;
      else if(cor.length>=N-E)wantErr=true;
      else wantErr=Math.random()<E/N;
    }
    used.push(x);
    const it={x:x,err:wantErr};
    if(q.t==='tf')it.text=q.q;
    else{
      let ai=q.a;
      if(wantErr){const others=q.o.map((_,j)=>j).filter(j=>j!==q.a);ai=others[Math.floor(Math.random()*others.length)]}
      it.q=q.q;it.text=q.o[ai];
    }
    (wantErr?err:cor).push(it);
  }
  const all=shuffle(err.concat(cor));
  L.last=L.last.concat(all.map(it=>it.x)).slice(-40);
  return all;
}

function fiveCheck(auto){
  if(L.state!=='ask')return;
  if(!auto&&L.sel.length!==fvE())return;
  let found=0;
  L.items.forEach((it,i)=>{
    const on=L.sel.indexOf(i)>-1;
    if(it.err&&on)found++;
    record({lid:it.x.lid,qi:it.x.qi,retry:false},on===it.err);
  });
  const perfect=found===fvE(),clean=perfect&&!L.hintRound,points=found+(clean?1:0);
  let healed=false,gotHint=false;
  if(clean){L.perfect++;L.streak++;if(L.streak%3===0){if(L.hp<FV_HP){L.hp++;healed=true}if(L.hints<5){L.hints++;gotHint=true}}}
  else if(!perfect){L.streak=0;L.hp--}
  L.found+=found;L.score+=points;L.rounds++;
  if(!L.ev)earnXp(points);
  if(L.score>fvBest())lsSet(fvBestKey(),String(L.score));
  if(L.ev)marSave(L.ev.id,L.score);else fvTopSave(L.score);

  if(ME)achRound({found:found,clean:clean,streak:L.streak,level:L.level,hintsUsed:L.hintsUsed,ev:!!L.ev}).forEach(id=>L.ach.push(id));

async function authSubmit(form){
  const btn=form.querySelector('button[type=submit]');

    okPw(a.id);btn.disabled=true;await cloudLogin(a.name,$('#lpn').value,true,a);btn.disabled=false;enter(a,$('#lrn').checked);
  }else if(form.id==='fLogin'){
    const a=ACC.list.find(x=>x.id===authSt.sel);if(!a)return;

    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
document.addEventListener('keydown',e=>{

  }
});

  });
}
